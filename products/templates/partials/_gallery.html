{% with product.images.all as images %}
<!-- Primary Image Showcase -->
<div
  class="aspect-square bg-[#F7F7F5] rounded-xl overflow-hidden border border-[#E4E4E7] flex items-center justify-center p-6 mb-4 relative group"
>
  {% if images %}
  <img
    id="main-product-image"
    src="{{ images.0.image.url }}"
    alt="{{ images.0.alt_text|default:product.title }}"
    class="w-full h-full object-contain transition-transform duration-300 group-hover:scale-105"
  />
  {% else %}
  <div class="text-center text-[#71717A]">
    <i class="fas fa-boxes text-5xl mb-3 text-[#A1A1AA]"></i>
    <p class="text-xs font-medium">No Image Available</p>
  </div>
  {% endif %}
</div>

<!-- Thumbnail Navigation Strip -->
{% if images|length > 1 %}
<div class="grid grid-cols-4 gap-3">
  {% for img in images %}
  <button
    type="button"
    onclick="document.getElementById('main-product-image').src='{{ img.image.url }}'; document.querySelectorAll('.thumb-btn').forEach(b => b.classList.remove('border-[#C62828]')); this.classList.add('border-[#C62828]')"
    class="thumb-btn aspect-square rounded-lg border-2 {% if forloop.first %}border-[#C62828]{% else %}border-[#E4E4E7]{% endif %} overflow-hidden bg-[#F7F7F5] p-1 transition focus:outline-none"
  >
    <img
      src="{{ img.image.url }}"
      alt="{{ img.alt_text|default:product.title }}"
      class="w-full h-full object-contain"
    />
  </button>
  {% endfor %}
</div>
{% endif %} {% endwith %}
