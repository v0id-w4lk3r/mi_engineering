<div id="inquiry-form-container" class="bg-white rounded-2xl border border-emerald-200 p-6 sm:p-7 shadow-sm text-center space-y-4 animate-fade-in">
  <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl shadow-inner">
    <i class="fas fa-check" aria-hidden="true"></i>
  </div>
  
  <div class="space-y-1">
    <h3 class="text-base font-bold text-brand-heading">Inquiry Sent Successfully!</h3>
    <p class="text-xs text-brand-body leading-relaxed">
      Thank you, <span class="font-semibold text-brand-heading">{{ inquiry.full_name }}</span>. We have received your inquiry for
      <span class="font-semibold text-brand-heading">{{ product.title }}</span>.
    </p>
  </div>

  <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-100 text-[11px] text-emerald-800 text-left space-y-1">
    <div class="flex items-center gap-1.5 font-semibold">
      <i class="fas fa-envelope-circle-check"></i> Confirmation sent to {{ inquiry.email }}
    </div>
    <p class="text-emerald-700">Our technical sales engineers review specs promptly and will respond with pricing &amp; availability.</p>
  </div>

  <div class="pt-2">
    <a
      href="https://wa.me/919819972301?text={{ 'Hi M.I. Engineering Works, I submitted an inquiry for '|urlencode }}{{ product.title|urlencode }}{{ '. Please check.'|urlencode }}"
      target="_blank"
      rel="noopener noreferrer"
      class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition shadow-sm w-full"
    >
      <i class="fab fa-whatsapp text-sm" aria-hidden="true"></i>
      <span>Connect on WhatsApp for Urgent Updates</span>
    </a>
  </div>
</div>
