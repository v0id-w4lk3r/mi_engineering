{% with product.images.all as images %}
<div class="space-y-4">
  <!-- Main Display Image -->
  <div class="aspect-square bg-brand-secondaryBg rounded-xl border border-brand-border overflow-hidden flex items-center justify-center p-6 relative group">
    {% if images %}
    <img
      id="main-product-image"
      src="{{ images.0.image.url }}"
      alt="{{ images.0.alt_text|default:product.title }}"
      class="w-full h-full object-contain transition-transform duration-300 group-hover:scale-105"
    />
    {% else %}
    <div class="text-center text-brand-muted">
      <i class="fas fa-boxes text-5xl mb-3" aria-hidden="true"></i>
      <p class="text-xs font-medium">No Image Available</p>
    </div>
    {% endif %}
  </div>

  <!-- Thumbnail Navigation -->
  {% if images|length > 1 %}
  <div class="grid grid-cols-4 gap-3">
    {% for img in images %}
    <button
      type="button"
      onclick="document.getElementById('main-product-image').src='{{ img.image.url }}'; document.querySelectorAll('.thumb-btn').forEach(b => b.classList.remove('border-brand-accent')); this.classList.add('border-brand-accent')"
      class="thumb-btn aspect-square rounded-xl border-2 {% if forloop.first %}border-brand-accent{% else %}border-brand-border{% endif %} overflow-hidden bg-brand-secondaryBg p-1.5 transition focus:outline-none"
    >
      <img
        src="{{ img.image.url }}"
        alt="{{ img.alt_text|default:product.title }}"
        class="w-full h-full object-contain"
      />
    </button>
    {% endfor %}
  </div>
  {% endif %}
</div>
{% endwith %}
