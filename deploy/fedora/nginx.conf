# ==============================================================================
# Nginx Production Configuration for Fedora Server (HTTPS with HTTP Redirect)
# Target: /etc/nginx/conf.d/mi_engineering.conf
# ==============================================================================

# HTTP: ACME Challenge & HTTP-to-HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name miengineeringworks.in www.miengineeringworks.in;

    # Let's Encrypt / Certbot Webroot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Production Reverse Proxy to Gunicorn
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miengineeringworks.in www.miengineeringworks.in;

    client_max_body_size 25M;

    # SSL Certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/miengineeringworks.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miengineeringworks.in/privkey.pem;

    # SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt challenge renewal location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Deny access to sensitive files (.env, .git, sqlite databases)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sqlite3|db)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static Files Configuration
    location /static/ {
        alias /var/deployment/mi_engineering/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        allow all;
    }

    # Media Files Configuration
    location /media/ {
        alias /var/data/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        allow all;
    }

    # Reverse Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
