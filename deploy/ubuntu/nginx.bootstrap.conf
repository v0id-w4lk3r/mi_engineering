# ==============================================================================
# Nginx Bootstrap Configuration for Ubuntu Server (HTTP-Only)
# Target: /etc/nginx/sites-available/miengineeringworks.in.conf
# Used before Let's Encrypt certificates are issued.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name miengineeringworks.in www.miengineeringworks.in;

    client_max_body_size 25M;

    # Let's Encrypt / Certbot Webroot Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Deny access to sensitive files (.env, .git, sqlite3)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static Files Configuration
    location /static/ {
        alias /var/deployment/mi_engineering/staticfiles/;
        expires 30d;
        access_log off;
        allow all;
    }

    # Media Files Configuration
    location /media/ {
        alias /var/data/media/;
        expires 30d;
        access_log off;
        allow all;
    }

    # Reverse Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
