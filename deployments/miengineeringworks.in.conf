server {
    server_name miengineeringworks.in www.miengineeringworks.in;

    client_max_body_size 20M;

    # Static Files Configuration
    location /static/ {
        alias /var/webhost/mi_engineering/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;

        # Ensures Nginx worker processes can access the directory
        allow all;
    }

    # Reverse Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SSL Configuration
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/miengineeringworks.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/miengineeringworks.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;

    server_name miengineeringworks.in www.miengineeringworks.in;

    # HTTP to HTTPS Redirect
    return 301 https://$host$request_uri;
}
