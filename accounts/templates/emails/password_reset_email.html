<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; background-color: #FAFAF9; color: #18181B; margin: 0; padding: 20px;">
  <div style="max-width: 500px; margin: 0 auto; background: #FFFFFF; border: 1px solid #E4E4E7; border-radius: 8px; padding: 24px;">
    <h2 style="color: #C62828; margin-top: 0;">M.I. ENGINEERING WORKS</h2>
    <p style="font-size: 14px; color: #52525B;">Hello,</p>
    <p style="font-size: 14px; color: #52525B;">You requested a password reset for your account. Click the button below to set a new password:</p>
    
    <div style="text-align: center; margin: 24px 0;">
      <a href="{{ protocol }}://{{ domain }}{% url 'accounts:password_reset_confirm' uidb64=uid token=token %}" 
         style="background-color: #C62828; color: #FFFFFF; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: bold; display: inline-block;">
        Reset Password
      </a>
    </div>

    <p style="font-size: 12px; color: #71717A;">If you did not request this, please ignore this email.</p>
  </div>
</body>
</html>
