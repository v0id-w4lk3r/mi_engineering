{% extends 'base.html' %}

{% block title %}Password Reset Complete | M.I. Engineering Works{% endblock %}

{% block content %}
<section class="py-16 bg-[#F7F7F5] min-h-[70vh] flex items-center">
  <div class="max-w-md w-full mx-auto px-6 text-center">
    <div class="bg-[#FFFFFF] p-8 rounded-xl border border-[#E4E4E7] shadow-sm">
      <div class="w-12 h-12 rounded-full bg-[#FFF5F5] text-[#C62828] flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-check-circle text-lg"></i>
      </div>
      <h1 class="text-xl font-bold text-[#18181B] mb-2">Password Reset Successful</h1>
      <p class="text-xs text-[#52525B] leading-relaxed mb-6">
        Your password has been reset. You can now sign in using your new credentials.
      </p>
      <a href="{% url 'accounts:login' %}" class="inline-block px-6 py-2.5 rounded-lg bg-[#C62828] text-white text-xs font-semibold hover:bg-[#A61F1F] transition">
        Sign In Now
      </a>
    </div>
  </div>
</section>
{% endblock %}
