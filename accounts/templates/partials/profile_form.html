<form
  method="post"
  action="{% url 'accounts:profile' %}"
  hx-post="{% url 'accounts:profile' %}"
  hx-target="#profile-form-container"
  hx-swap="innerHTML"
  class="space-y-6"
>
  {% csrf_token %} 
  {% if messages %}
  <div class="space-y-2">
    {% for message in messages %}
    <div
      class="p-3.5 rounded-xl text-xs font-bold {% if message.tags == 'error' %}bg-red-50 text-red-800 border border-red-200{% else %}bg-emerald-50 text-emerald-800 border border-emerald-200{% endif %}"
    >
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- User & Company Details -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >Company Name</label
      >
      <input
        type="text"
        name="company_name"
        value="{{ form.company_name.value|default:request.user.company_name|default:'' }}"
        class="w-full px-3.5 py-2.5 bg-[#F7F7F5] border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C62828]/20 focus:border-[#C62828]"
        placeholder="e.g. Acme Precision Ltd."
      />
      {% if form.company_name.errors %}
      <p class="text-xs text-red-600 mt-1">{{ form.company_name.errors.0 }}</p>
      {% endif %}
    </div>

    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >Phone Number</label
      >
      <input
        type="text"
        name="phone_number"
        value="{{ form.phone_number.value|default:request.user.phone_number|default:'' }}"
        class="w-full px-3.5 py-2.5 bg-[#F7F7F5] border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C62828]/20 focus:border-[#C62828]"
        placeholder="+1 (555) 000-0000"
      />
      {% if form.phone_number.errors %}
      <p class="text-xs text-red-600 mt-1">{{ form.phone_number.errors.0 }}</p>
      {% endif %}
    </div>
  </div>

  <!-- Business Identification & Industry -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >Tax / Business ID (GSTIN, VAT, EIN)</label
      >
      <input
        type="text"
        name="tax_id"
        value="{{ form.tax_id.value|default:profile.tax_id|default:'' }}"
        class="w-full px-3.5 py-2.5 bg-[#F7F7F5] border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C62828]/20 focus:border-[#C62828]"
        placeholder="GSTIN / VAT / EIN Registration"
      />
    </div>

    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >Industry Sector</label
      >
      <input
        type="text"
        name="industry_type"
        value="{{ form.industry_type.value|default:profile.industry_type|default:'' }}"
        class="w-full px-3.5 py-2.5 bg-[#F7F7F5] border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C62828]/20 focus:border-[#C62828]"
        placeholder="e.g. Aerospace, Automotive, Machining"
      />
    </div>
  </div>

  <!-- International & Currency Settings -->
  <div
    class="grid grid-cols-1 sm:grid-cols-3 gap-5 p-4 bg-[#F7F7F5] rounded-xl border border-[#E4E4E7]"
  >
    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >Country</label
      >
      <input
        type="text"
        name="country"
        value="{{ form.country.value|default:profile.country|default:'' }}"
        class="w-full px-3.5 py-2 bg-white border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:outline-none focus:border-[#C62828]"
        placeholder="Country"
      />
    </div>

    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >Billing Currency</label
      >
      <select
        name="preferred_currency"
        class="w-full px-3.5 py-2 bg-white border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:outline-none focus:border-[#C62828]"
      >
        <option
          value="USD"
          {%
          if
          profile.preferred_currency=""
          ="USD"
          %}selected{%
          endif
          %}
        >
          USD ($)
        </option>
        <option
          value="INR"
          {%
          if
          profile.preferred_currency=""
          ="INR"
          %}selected{%
          endif
          %}
        >
          INR (₹)
        </option>
        <option
          value="EUR"
          {%
          if
          profile.preferred_currency=""
          ="EUR"
          %}selected{%
          endif
          %}
        >
          EUR (€)
        </option>
        <option
          value="GBP"
          {%
          if
          profile.preferred_currency=""
          ="GBP"
          %}selected{%
          endif
          %}
        >
          GBP (£)
        </option>
        <option
          value="AED"
          {%
          if
          profile.preferred_currency=""
          ="AED"
          %}selected{%
          endif
          %}
        >
          AED (د.إ)
        </option>
        <option
          value="CAD"
          {%
          if
          profile.preferred_currency=""
          ="CAD"
          %}selected{%
          endif
          %}
        >
          CAD ($)
        </option>
        <option
          value="AUD"
          {%
          if
          profile.preferred_currency=""
          ="AUD"
          %}selected{%
          endif
          %}
        >
          AUD ($)
        </option>
      </select>
    </div>

    <div class="flex items-center pt-5">
      <label
        class="inline-flex items-center gap-2 text-xs font-bold text-[#18181B] cursor-pointer"
      >
        <input
          type="checkbox"
          name="is_international"
          {%
          if
          profile.is_international
          %}checked{%
          endif
          %}
          class="w-4 h-4 rounded border-[#E4E4E7] text-[#C62828] focus:ring-[#C62828]"
        />
        <span>International Account</span>
      </label>
    </div>
  </div>

  <!-- Addresses -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >Billing Address</label
      >
      <textarea
        name="billing_address"
        rows="3"
        class="w-full px-3.5 py-2.5 bg-[#F7F7F5] border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C62828]/20 focus:border-[#C62828]"
        placeholder="Full billing address..."
      >
{{ form.billing_address.value|default:profile.billing_address|default:'' }}</textarea
      >
    </div>

    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >Shipping Address</label
      >
      <textarea
        name="shipping_address"
        rows="3"
        class="w-full px-3.5 py-2.5 bg-[#F7F7F5] border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C62828]/20 focus:border-[#C62828]"
        placeholder="Full shipping address..."
      >
{{ form.shipping_address.value|default:profile.shipping_address|default:'' }}</textarea
      >
    </div>
  </div>

  <!-- City, State, Zip -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >City</label
      >
      <input
        type="text"
        name="city"
        value="{{ form.city.value|default:profile.city|default:'' }}"
        class="w-full px-3.5 py-2.5 bg-[#F7F7F5] border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C62828]/20 focus:border-[#C62828]"
      />
    </div>

    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >State / Province</label
      >
      <input
        type="text"
        name="state"
        value="{{ form.state.value|default:profile.state|default:'' }}"
        class="w-full px-3.5 py-2.5 bg-[#F7F7F5] border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C62828]/20 focus:border-[#C62828]"
      />
    </div>

    <div>
      <label class="block text-xs font-bold uppercase text-[#71717A] mb-1.5"
        >Postal / ZIP Code</label
      >
      <input
        type="text"
        name="postal_code"
        value="{{ form.postal_code.value|default:profile.postal_code|default:'' }}"
        class="w-full px-3.5 py-2.5 bg-[#F7F7F5] border border-[#E4E4E7] rounded-xl text-xs text-[#18181B] focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#C62828]/20 focus:border-[#C62828]"
      />
    </div>
  </div>

  <!-- Submit -->
  <div class="pt-4 border-t border-[#E4E4E7] flex justify-end">
    <button
      type="submit"
      class="inline-flex items-center gap-2 px-6 py-3 bg-[#18181B] text-white font-bold text-xs rounded-xl hover:bg-[#27272A] transition shadow-md cursor-pointer"
    >
      <i class="fas fa-save"></i> Save Profile Details
    </button>
  </div>
</form>
