<div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
  <!-- Active Inquiries Card -->
  <div
    class="bg-white rounded-2xl p-6 border border-brand-border shadow-sm flex justify-between items-start"
  >
    <div>
      <p class="text-[11px] font-bold uppercase tracking-wider text-brand-muted">
        Total Inquiries & RFQs
      </p>
      <p class="text-3xl font-black text-brand-accent mt-2">
        {{ total_enquiries_count|default:"0" }}
      </p>
    </div>
    <div class="p-3 bg-brand-accent/10 rounded-xl text-brand-accent">
      <i class="fas fa-file-invoice text-xl"></i>
    </div>
  </div>

  <!-- User Account Role Status -->
  <div
    class="bg-white rounded-2xl p-6 border border-brand-border shadow-sm flex justify-between items-start"
  >
    <div>
      <p class="text-[11px] font-bold uppercase tracking-wider text-brand-muted">
        Account Status
      </p>
      <p class="text-xl font-bold text-brand-heading mt-2">
        Verified Client
      </p>
    </div>
    <div class="p-3 bg-green-50 rounded-xl text-green-600">
      <i class="fas fa-check-circle text-xl"></i>
    </div>
  </div>
</div>
