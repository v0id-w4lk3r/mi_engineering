<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
  <!-- Total Orders Card -->
  <div class="bg-white rounded-2xl p-6 border border-[#E4E4E7] shadow-sm flex justify-between items-start">
    <div>
      <p class="text-[11px] font-bold uppercase tracking-wider text-[#71717A]">Total Orders</p>
      <p class="text-3xl font-black text-[#18181B] mt-2">{{ total_orders_count|default:"0" }}</p>
    </div>
    <div class="p-3 bg-[#F7F7F5] rounded-xl text-[#71717A]">
      <i class="fas fa-box text-xl"></i>
    </div>
  </div>

  <!-- Active Enquiries Card -->
  <div class="bg-white rounded-2xl p-6 border border-[#E4E4E7] shadow-sm flex justify-between items-start">
    <div>
      <p class="text-[11px] font-bold uppercase tracking-wider text-[#71717A]">Active Enquiries / Quotes</p>
      <p class="text-3xl font-black text-[#C62828] mt-2">{{ total_enquiries_count|default:"0" }}</p>
    </div>
    <div class="p-3 bg-[#C62828]/10 rounded-xl text-[#C62828]">
      <i class="fas fa-file-invoice text-xl"></i>
    </div>
  </div>

  <!-- Tax / Business ID Card -->
  <div class="bg-white rounded-2xl p-6 border border-[#E4E4E7] shadow-sm flex justify-between items-start">
    <div>
      <p class="text-[11px] font-bold uppercase tracking-wider text-[#71717A]">Tax / Business ID</p>
      <p class="text-base font-bold text-[#18181B] mt-2 truncate max-w-[150px]" title="{{ profile.tax_id }}">
        {{ profile.tax_id|default:"Not Provided" }}
      </p>
    </div>
    <div class="p-3 bg-[#F7F7F5] rounded-xl text-[#71717A]">
      <i class="fas fa-id-card text-xl"></i>
    </div>
  </div>

  <!-- Preferred Currency Card -->
  <div class="bg-white rounded-2xl p-6 border border-[#E4E4E7] shadow-sm flex justify-between items-start">
    <div>
      <p class="text-[11px] font-bold uppercase tracking-wider text-[#71717A]">Preferred Currency</p>
      <p class="text-xl font-bold text-[#18181B] mt-2">{{ profile.get_preferred_currency_display|default:"USD ($)" }}</p>
    </div>
    <div class="p-3 bg-[#F7F7F5] rounded-xl text-[#71717A]">
      <i class="fas fa-globe text-xl"></i>
    </div>
  </div>
</div>
