{% extends 'base.html' %}

{% block title %}Change Password | M.I. Engineering Works{% endblock %}

{% block content %}
<section class="py-16 bg-[#F7F7F5] min-h-[70vh] flex items-center">
  <div class="max-w-md w-full mx-auto px-6">
    <div class="bg-[#FFFFFF] p-8 rounded-xl border border-[#E4E4E7] shadow-sm">
      <div class="text-center mb-6">
        <span class="text-xs font-bold uppercase tracking-widest text-[#C62828] block mb-1">Account Security</span>
        <h1 class="text-xl font-bold text-[#18181B]">Update Password</h1>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
          <div>
            <label for="{{ field.id_for_label }}" class="block text-xs font-bold uppercase tracking-wider text-[#18181B] mb-1">{{ field.label }}</label>
            <input type="password" name="{{ field.name }}" id="{{ field.id_for_label }}" required class="w-full px-3.5 py-2.5 rounded-lg border border-[#E4E4E7] bg-[#FAFAF9] text-sm text-[#18181B] focus:outline-none focus:border-[#C62828]">
            {% if field.errors %}
              <p class="text-xs text-[#C62828] mt-1">{{ field.errors.0 }}</p>
            {% endif %}
          </div>
        {% endfor %}

        <button type="submit" class="w-full py-2.5 rounded-lg bg-[#C62828] text-white text-sm font-semibold hover:bg-[#A61F1F] transition">
          Update Password
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
