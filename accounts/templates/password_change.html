{% extends 'base.html' %}

{% block title %}Change Password | M.I. Engineering Works{% endblock %}

{% block content %}
<section class="py-16 bg-brand-secondaryBg min-h-[70vh] flex items-center">
  <div class="max-w-md w-full mx-auto px-6">
    <div class="bg-brand-bgp-8 rounded-xl border border-brand-border shadow-sm">
      <div class="text-center mb-6">
        <span class="text-xs font-bold uppercase tracking-widest text-brand-accent block mb-1">Account Security</span>
        <h1 class="text-xl font-bold text-brand-heading">Update Password</h1>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
          <div>
            <label for="{{ field.id_for_label }}" class="block text-xs font-bold uppercase tracking-wider text-brand-headingding mb-1">{{ field.label }}</label>
            <input type="password" name="{{ field.name }}" id="{{ field.id_for_label }}" required class="w-full px-3.5 py-2.5 rounded-lg border border-brand-border bg-brand-card text-sm text-brand-heading focus:outline-none focus:border-brand-accent">
            {% if field.errors %}
              <p class="text-xs text-brand-accent mt-1">{{ field.errors.0 }}</p>
            {% endif %}
          </div>
        {% endfor %}

        <button type="submit" class="w-full py-2.5 rounded-lg bg-brand-accent text-white text-sm font-semibold hover:bg-brand-accentHover transition">
          Update Password
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
