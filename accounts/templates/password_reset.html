{% extends 'base.html' %}

{% block title %}Reset Password | M.I. Engineering Works{% endblock %}

{% block content %}
<section class="py-16 bg-[#F7F7F5] min-h-[70vh] flex items-center">
  <div class="max-w-md w-full mx-auto px-6">
    <div class="bg-[#FFFFFF] p-8 rounded-xl border border-[#E4E4E7] shadow-sm">
      <div class="text-center mb-6">
        <span class="text-xs font-bold uppercase tracking-widest text-[#C62828] block mb-1">Account Recovery</span>
        <h1 class="text-xl font-bold text-[#18181B]">Forgot Your Password?</h1>
        <p class="text-xs text-[#71717A] mt-1">Enter your registered email address to receive password reset instructions.</p>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label for="id_email" class="block text-xs font-bold uppercase tracking-wider text-[#18181B] mb-1">Email Address</label>
          <input type="email" name="email" id="id_email" required class="w-full px-3.5 py-2.5 rounded-lg border border-[#E4E4E7] bg-[#FAFAF9] text-sm text-[#18181B] focus:outline-none focus:border-[#C62828]">
        </div>

        <button type="submit" class="w-full py-2.5 rounded-lg bg-[#C62828] text-white text-sm font-semibold hover:bg-[#A61F1F] transition">
          Send Reset Link
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-[#E4E4E7] text-center">
        <a href="{% url 'accounts:login' %}" class="text-xs text-[#71717A] hover:text-[#18181B]">&larr; Back to Sign In</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
