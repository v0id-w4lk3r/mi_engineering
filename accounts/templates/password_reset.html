{% extends 'base.html' %}

{% block title %}Reset Password | M.I. Engineering Works{% endblock %}

{% block content %}
<section class="py-16 bg-brand-secondaryBg min-h-[70vh] flex items-center">
  <div class="max-w-md w-full mx-auto px-6">
    <div class="bg-brand-bgp-8 rounded-xl border border-brand-border shadow-sm">
      <div class="text-center mb-6">
        <span class="text-xs font-bold uppercase tracking-widest text-brand-accent block mb-1">Account Recovery</span>
        <h1 class="text-xl font-bold text-brand-heading">Forgot Your Password?</h1>
        <p class="text-xs text-brand-muted mt-1">Enter your registered email address to receive password reset instructions.</p>
      </div>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label for="id_email" class="block text-xs font-bold uppercase tracking-wider text-brand-heading mb-1">Email Address</label>
          <input type="email" name="email" id="id_email" required class="w-full px-3.5 py-2.5 rounded-lg border border-brand-border bg-brand-card text-sm text-brand-heading focus:outline-none focus:border-brand-accent">
        </div>

        <button type="submit" class="w-full py-2.5 rounded-lg bg-brand-accent text-white text-sm font-semibold hover:bg-brand-accentHover transition">
          Send Reset Link
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-brand-border text-center">
        <a href="{% url 'accounts:login' %}" class="text-xs text-brand-muted hover:text-brand-heading">&larr; Back to Sign In</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
