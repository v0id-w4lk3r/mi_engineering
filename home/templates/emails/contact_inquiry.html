<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333">
    <h2 style="color: #202124">New Industrial Inquiry Received</h2>
    <p><strong>From:</strong> {{ full_name }} ({{ email }})</p>
    <hr style="border: 0; border-top: 1px solid #e4e4e7" />
    <h3>Message / Specifications:</h3>
    <blockquote
      style="
        background: #f7f7f5;
        padding: 12px 16px;
        border-left: 4px solid #c62828;
        margin: 0;
      "
    >
      {{ message|linebreaksbr }}
    </blockquote>
    <p style="font-size: 12px; color: #71717a; margin-top: 24px">
      Sent via M.I. Engineering Works Web Portal
    </p>
  </body>
</html>
