<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #18181b;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
        padding: 24px;
      }
      .header {
        color: #c62828;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 16px;
      }
      .message-box {
        background: #f7f7f5;
        padding: 16px;
        border-radius: 6px;
        white-space: pre-line;
        margin-top: 12px;
      }
      .footer {
        margin-top: 24px;
        font-size: 12px;
        color: #71717a;
        border-top: 1px solid #f4f4f5;
        padding-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">M.I. Engineering Works</div>
      <p>Dear {{ full_name }},</p>
      <p>
        Thank you for reaching out to us. We have received your inquiry and our
        team is reviewing your requirements.
      </p>

      <div class="message-box">
        <strong>Your Inquiry Details:</strong>
        <p style="margin-top: 8px; margin-bottom: 0">{{ message }}</p>
      </div>

      <p style="margin-top: 20px">We will get back to you shortly.</p>

      <div class="footer">
        This is an automated confirmation from M.I. Engineering Works.
      </div>
    </div>
  </body>
</html>
