{% extends 'base.html' %}

{% block title %}Contact Us - M.I. Engineering Works{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-8 px-4">
    <div class="bg-white rounded-3xl border border-brand-border p-8 md:p-12 shadow-sm">
        <h1 class="text-3xl font-bold text-brand-heading mb-2">Contact Industrial Sales</h1>
        <p class="text-brand-body mb-8">Have a specific material requirement or quotation request? Send us your specs below.</p>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-brand-heading mb-2">Full Name</label>
                    <input type="text" required class="w-full px-4 py-3 rounded-xl border border-brand-border focus:ring-2 focus:ring-brand-accent focus:outline-none" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-brand-heading mb-2">Work Email</label>
                    <input type="email" required class="w-full px-4 py-3 rounded-xl border border-brand-border focus:ring-2 focus:ring-brand-accent focus:outline-none" placeholder="john@company.com">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-brand-heading mb-2">Requirements / Specifications</label>
                <textarea rows="4" required class="w-full px-4 py-3 rounded-xl border border-brand-border focus:ring-2 focus:ring-brand-accent focus:outline-none" placeholder="Specify dimensions, material grade, and quantity..."></textarea>
            </div>
            <button type="submit" class="w-full md:w-auto bg-brand-primary text-white px-8 py-3 rounded-xl font-medium hover:bg-brand-primaryHover transition">
                Submit Inquiry
            </button>
        </form>
    </div>
</div>
{% endblock %}
